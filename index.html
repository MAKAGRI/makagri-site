<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makagri | Your Partner in Success</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }
    .hero {
      background: url('https://source.unsplash.com/1600x600/?business') no-repeat center center/cover;
      padding: 100px 20px;
    }
    h1 {
      font-size: 3em;
      margin: 0;
    }
    .contact {
      padding: 50px 20px;
      background-color: #111;
    }
    form {
      max-width: 500px;
      margin: 0 auto;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      padding: 20px;
      background-color: #000;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Your Partner in Success</h1>
  </div>
  <div class="contact">
    <h2>Contact Us</h2>
    <p>Drop us a line!</p>
    <form>
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />
      <textarea placeholder="Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
  <footer>
    &copy; 2025 Makagri. All rights reserved. | Email: contact@makagri.shop
  </footer>
</body>
</html>
